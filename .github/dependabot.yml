version: 2
updates:
  # GitHub uses the "npm" ecosystem for npm, yarn, and pnpm manifests/lockfiles.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # Wait out pnpm's release-age gate so CI installs without bypassing it.
    # Security updates ignore the cooldown and may need a CI re-run a day later.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  # Keeps the commit-SHA pins in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
